name: LinkedIn Auto-Publisher & Keep-Alive

on:
  schedule:
    # Runs every 15 minutes to guarantee Render is awake and trigger scheduled posts
    - cron: '*/15 * * * *'
    # Dedicated trigger at 11:55, 12:00, 12:15 UTC (around 8:55-9:15 AM Chile) Monday to Friday
    - cron: '55 11 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '15 12 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  trigger-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render and Trigger Auto-Publish
        run: |
          echo "Triggering LinkedIn auto-publisher on Render..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://linkedin-nico.onrender.com/api/cron/trigger-publish")
          echo "$RESPONSE"
          echo "Health check verification..."
          curl -s "https://linkedin-nico.onrender.com/api/health" | jq . || true
          echo "Trigger cycle finished."
